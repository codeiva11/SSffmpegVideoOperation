name: Build
on:
  push:
    branches: [compose-migration]
  pull_request:
    branches: [compose-migration]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Debug Maven Central reachability
        run: |
          echo "--- ffmpeg-kit-full 6.0.LTS POM ---"
          curl -sI https://repo.maven.apache.org/maven2/com/arthenica/ffmpeg-kit-full/6.0.LTS/ffmpeg-kit-full-6.0.LTS.pom | head -n 3
          echo "--- ffmpeg-kit-full maven-metadata ---"
          curl -s https://repo.maven.apache.org/maven2/com/arthenica/ffmpeg-kit-full/maven-metadata.xml | head -n 12
          echo "--- control: core-ktx POM ---"
          curl -sI https://repo.maven.apache.org/maven2/androidx/core/core-ktx/1.13.1/core-ktx-1.13.1.pom | head -n 3
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
