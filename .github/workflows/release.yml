name: Signed Release APK
# Builds a SIGNED release APK on the GitHub runner, using the release
# keystore stored in Actions secrets (SSF_RELEASE_KEYSTORE_*).
on:
  push:
    branches: [compose-migration, main]
  workflow_dispatch:
# A new push cancels the previous run on this branch, so only the
# newest code builds — no pile-up of stale queued runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SSF_RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
      - name: Build signed release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.SSF_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SSF_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SSF_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release.apk
      - name: Compute APK checksum
        # Sidecar the in-app updater verifies before installing.
        run: sha256sum app/build/outputs/apk/release/app-release.apk | awk '{print $1}' > app-release.apk.sha256
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0.0-${{ github.run_number }}"
          NOTES="Signed release APK — Compose + MVI migration (all 25 operation screens), H.265 (HEVC) compression via libx265, outputs saved to the public 'Ffmpeg Output' folder on phone storage. Note: the FFmpeg engine is ffmpeg-kit-full-gpl (libx265 is GPL-only), so this build is GPL-licensed."
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk app-release.apk.sha256 --title "$TAG" --notes "$NOTES" || gh release upload "$TAG" app/build/outputs/apk/release/app-release.apk app-release.apk.sha256 --clobber
