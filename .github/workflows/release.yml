name: Signed Release APK
# Builds a SIGNED release APK on the GitHub runner, using the release
# keystore stored in Actions secrets (SSF_RELEASE_KEYSTORE_*).
on:
  push:
    branches: [compose-migration]
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SSF_RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
      - name: Build signed release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.SSF_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SSF_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SSF_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release.apk
