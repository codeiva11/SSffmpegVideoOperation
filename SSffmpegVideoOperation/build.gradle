plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'maven-publish'
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.release
                groupId = 'com.simform.videooperations'
                artifactId = 'videooperations'
                version = '2.0.0'
            }
        }
    }
}

android {
    namespace 'com.simform.videooperations'
    compileSdk 34

    defaultConfig {
        minSdk 24
        consumerProguardFiles "consumer-rules.pro"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0']
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    // FFmpeg engine: ffmpeg-kit-next 9.1.0 (FFmpeg 9.1 "Gauss"), built from
    // source in codeiva11/ffmpeg-kit-next (release v9.1.0). Same GPL coverage
    // as the old full-gpl flavour: libx265 (H.265/HEVC) and libx264 are
    // GPL-licensed and included. Consequence: an app shipping this library
    // is GPL-licensed. The universal AAR (110 MB, all 4 ABIs) is downloaded
    // at build time by the downloadFfmpegKitAar task (see root build.gradle)
    // and verified by SHA-256 - it is not committed to this repo.
    // Query builders in this module use only the Kotlin stdlib and are KMP-ready;
    // only the runner (CallBackOfQuery) touches this Android-only dependency.
    implementation files(rootProject.file(rootProject.ext.ffmpegKitNextAarFile))
    // Transitive dep of the AAR (declared in its POM): file dependencies
    // carry no transitive deps, so it is declared explicitly.
    implementation 'com.arthenica:smart-exception-java:0.2.1'
}

// Download the ffmpeg-kit-next AAR before compiling (no-op when already present and verified).
tasks.named('preBuild').configure { dependsOn(rootProject.tasks.named('downloadFfmpegKitAar')) }
