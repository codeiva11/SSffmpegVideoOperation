plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'maven-publish'
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.release
                groupId = 'com.simform.videooperations'
                artifactId = 'videooperations'
                version = '2.0.0'
            }
        }
    }
}

android {
    namespace 'com.simform.videooperations'
    compileSdk 34

    defaultConfig {
        minSdk 24
        consumerProguardFiles "consumer-rules.pro"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0']
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    // FFmpeg engine: ffmpeg-kit-full-gpl 6.0.LTS (maintained successor of
    // mobile-ffmpeg 4.4). The -gpl variant is required for libx265 (H.265/HEVC)
    // and libx264: both are GPL-licensed and absent from the plain full
    // package. Consequence: an app shipping this library is GPL-licensed.
    // Query builders in this module use only the Kotlin stdlib and are KMP-ready;
    // only the runner (CallBackOfQuery) touches this Android-only dependency.
    implementation 'com.arthenica:ffmpeg-kit-full-gpl:6.0.LTS'
}
