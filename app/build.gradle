plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21'
}

android {
    namespace 'com.simform.videoimageeditor'
    compileSdk 34

    defaultConfig {
        applicationId "com.simform.videoimageeditor"
        minSdk 24
        targetSdk 34
        versionCode (System.getenv('VERSION_CODE')?.toInteger() ?: 1)
        versionName "2.0.0"
    }

    // Release signing: the keystore lives in GitHub Actions secrets
    // (SSF_RELEASE_KEYSTORE_BASE64 / _PASSWORD / _ALIAS / _PASSWORD) and is
    // decoded to release.keystore by the release workflow. The config is
    // only wired when the env vars exist, so plain debug builds keep
    // working without them.
    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_FILE")) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        // AppUpdater reads BuildConfig.VERSION_CODE to compare against
        // the latest release tag.
        buildConfig true
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.5'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.5'
    implementation 'androidx.navigation:navigation-compose:2.8.0'
    // Coil 3 (KMP-compatible) for the GIF preview on the merge-GIF screen.
    implementation 'io.coil-kt.coil3:coil-compose:3.0.4'
    implementation 'io.coil-kt.coil3:coil-gif:3.0.4'
    implementation project(':SSffmpegVideoOperation')
}
